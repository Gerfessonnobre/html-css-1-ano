<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Bolsa Familia</title>
</head>
<body>
    NOME <br>
    <input type="text" placeholder="Ex: João da Silva"><br> <br>

    IDADE <br>
    <input type="number" value="idade" placeholder="18" value="0"><br> <br>

    EMAIL <br>
    <input type="email" placeholder="Ex: joao@silva.com"><br><br>

    SALÁRIO <br>
    <input type="number" value="salario" placeholder="Digite o salário"><br><br>

    SENHA <br>
    <input type="password" value="senha" placeholder="Digite uma senha forte"><br><br>

    ESTADO <br><select name="estado" placeholder="-Selecione-">
        <option value="CE">Ceará</option>
        <option value="PE">Pernambuco</option>
        <option value="RN">Rio Grande Do Norte</option>
        <option value="BA">Bahia</option>
        <option value="SE">Sergipe</option>
    </select><br><br>
    INTERESSES <br>
    <input type="checkbox" value="html">HTML
    <input type="checkbox" name="css">CSS
    <input type="checkbox" name="javascript">Javascript
    <input type="checkbox" name="php">PHP <br><br>

    TIPO DE TRABALHO <br>
    <input type="radio" value="frontend">Front-End
    <input type="radio" value="backend">Back-End
    <input type="radio" value="fullstack">Full Stack <br><br>

    DATA DE NASCIMENTO <br>
    <input type="date" value="data" placeholder="21/05/1994">

    
</body>
</html>
