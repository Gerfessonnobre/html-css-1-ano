<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form>
        NOME: <input type="text" name="nome" placeholder="Digite seu Nome"> <br>
        IDADE: <input type="number" name="idade" min="0" max="150" step="1"> <br>
        SENHA: <input type="password" name="senha" maxlength="10" minlength="1" placeholder="Digite sua Senha"> <br>
        EMAIL: <input type="email" name="email"> <br>
        SEXO: <input type="radio" name="sexo" value="masculino"> Masculino
        <input type="radio" name="sexo" value="feminino"> Feminino <br>

        TURNO: <input type="checkbox" name="manha" value="manha"> Manhã
        <input type="checkbox" name="tarde" value="tarde"> Tarde
        <input type="checkbox" name="noite" value="noite"> Noite <br>

        DATA: <input type="date" name="data"> <br>

        ESTADO: <select name="estado">
            <option value="CE">Ceará</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="PB">Paraíba3</option>
        </select>

    </form>    
</body>
</html>
